[project]
name = "smart-flight-hotel-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ziauddin-Farrukh-Syed", email = "zs23acy@herts.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langchain[mcp]>=1.4.3",
    "mcp[cli]>=2.3.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
smart-flight-hotel-agent = "smart_flight_hotel_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
